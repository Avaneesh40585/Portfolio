    <link rel="stylesheet" href="styles.css" />

    <!-- Apply the saved theme before first paint so the palette never flashes. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('rh-theme');
          if (t === 't-acid' || t === 't-dark') {
            document.documentElement.className = t;
          }
        } catch (e) {}
      })();
    </script>
